name: shapekit
description: Read and write ESRI Shapefiles and GeoPackage feature data in Dart, with streaming, typed geometries, and DBF attribute support.
version: 0.3.0
repository: https://github.com/Silvesterrr/shapekit
homepage: https://github.com/Silvesterrr/shapekit
issue_tracker: https://github.com/Silvesterrr/shapekit/issues
funding:
  - https://www.buymeacoffee.com/sylwesterjarosz

topics:
  - shapefile
  - gis
  - geospatial
  - esri
  - mapping

environment:
  sdk: ^3.9.0

dependencies:
  cp949_codec: ^1.0.2
  meta: ^1.15.0
  sqlite3: ^2.9.4


dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
